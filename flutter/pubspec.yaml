name: guokit_im
description: guokit IM（果壳软件即时通讯）Flutter 客户端 SDK：令牌续期、断线对账、本地消息缓存、发送重试与去重、图片收发。
version: 0.4.1
homepage: https://github.com/guokit/im-sdk
repository: https://github.com/guokit/im-sdk
publish_to: none

environment:
  sdk: '>=3.10.3 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  centrifuge: ^0.21.0
  http: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: any
