name: guokit_im_example
description: guokit_im 最小示例：登录、会话列表、收发文本、图片、语音、文件与视频、撤回、已读、正在输入。
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  guokit_im:
    path: ../
  path_provider: ^2.1.6
  record: ^7.2.0
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
