openapi: 3.1.0
info:
  title: IM 接入接口规范
  version: 1.0.0
  description: |
    IM 服务的 HTTP 接口规范，与《IM 接入文档》配套，字段与错误码以服务端实现为准。

    - 服务端接口（`/api/im/v1/server/*`）由接入方**后端**调用，鉴权用请求头 `X-Api-Key`。
    - 客户端接口（`/api/im/v1/*`）与客服接口（`/api/imcs/v1/*`，其中 `/api/imcs/v1/server/*` 由接入方后端调）由 App / Web 调用，鉴权用 `Authorization: Bearer <用户令牌>`。
    - 响应包统一为 `{"code", "message", "data"}`：**成功时 `code` 是整数 `0`；失败时 `code` 是字符串错误码**，`data` 为 `{}`。
      部分业务失败（如 `IM_USER_NOT_FOUND`、`IM_BLOCKED`、`IM_RATE_LIMITED`）走 **HTTP 200 + 业务码**，判断成功请严格比较 `code === 0`。
    - 时间均为 `YYYY-MM-DD HH:mm:ss` 字符串，时区固定 Asia/Shanghai（UTC+8）。各种 id、seq 均为整数，user_id 为字符串。
    - 全部接口还受站点授权校验：授权异常时回 HTTP 403 + `LICENSE_INVALID` / `LICENSE_EXPIRED` / `LICENSE_DOMAIN`。

    长连接（WebSocket，Centrifuge 协议）不在本规范内，地址、鉴权、断开码见接入文档 §6；
    经长连接下发的推送事件写成了 schema：`PushMessage`、`PushRead`、`PushReadAll`、`PushConversationChanged`、`PushMessageRecalled`、`PushPeerRead`、`PushTyping`。
    将来可能增加推送事件与消息类型，不认识的忽略或兜底显示。
servers:
  - url: https://im.example.com
    description: 示例地址，换成你的 IM 服务域名
tags:
  - name: 服务端
    description: 接入方后端调用，`X-Api-Key` 鉴权。每个接入应用另有调用频率上限，超出回 HTTP 200 + `IM_RATE_LIMITED`。
  - name: 客户端
    description: App / Web 调用，用户令牌鉴权。令牌失效统一回 401 `IM_TOKEN_INVALID`。
  - name: 客服
    description: 站点装了客服模块时可用，用户令牌鉴权，路径前缀是 `/api/imcs/v1`。
  - name: 客服主体
    description: 一个站点里分出多个独立接待的客服（如每家门店一个）。站点装了客服模块时可用，接入方后端调用，`X-Api-Key` 鉴权，频率与服务端接口合计。

paths:
  # ---------------- 服务端接口 ----------------
  /api/im/v1/server/ping:
    get:
      tags: [服务端]
      operationId: serverPing
      summary: 连通与 Key 自检
      security: [{ ApiKey: [] }]
      responses:
        '200':
          description: 成功返回当前接入应用；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [app_id, name]
                            properties:
                              app_id: { type: integer, format: int64, description: 接入应用 id }
                              name: { type: string, description: 接入应用名称 }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }

  /api/im/v1/server/users/batch:
    post:
      tags: [服务端]
      operationId: serverBatchUsers
      summary: 批量导入用户
      description: 每批 1–100 个，任一项不合法则整批拒绝（`message` 指出第几个），同一事务写入。已存在的用户只覆盖昵称与头像。
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200':
          description: 成功返回写入条数；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [count]
                            properties:
                              count: { type: integer, description: 本批用户数 }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/users/online:
    post:
      tags: [服务端]
      operationId: serverOnlineUsers
      summary: 查询在线状态
      description: 每次 1–100 个，去重后按请求顺序返回。在线 = 该用户当前至少有一条长连接。不存在或被封禁的用户返回 `false`，不报错。这个接口是在线状态的权威来源，`user_state` 回调只是提醒。
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      responses:
        '200':
          description: 成功返回每个用户的在线状态；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [items]
                            properties:
                              items:
                                type: array
                                items:
                                  type: object
                                  required: [user_id, online]
                                  properties:
                                    user_id: { type: string }
                                    online: { type: boolean }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    put:
      tags: [服务端]
      operationId: serverPutUser
      summary: 导入或更新单个用户
      description: 用户已存在时只覆盖昵称与头像（传空串即清空），不改封禁状态、不影响已签令牌。
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 64, description: 昵称，可空，≤64 字 }
                avatar_url: { type: string, maxLength: 512, description: 头像，可空，http(s) 链接且 ≤512 字符 }
      responses:
        '200':
          description: 成功返回 user_id；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data: { $ref: '#/components/schemas/UserIdData' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      tags: [服务端]
      operationId: serverPatchUser
      summary: 封禁 / 解封用户
      description: 封禁使该用户全部已签令牌立即失效并断开所有长连接；解封不恢复旧令牌，需重新签发。
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: integer
                  enum: [0, 1]
                  description: 0 封禁、1 正常
      responses:
        '200':
          description: 成功返回 user_id 与新状态；用户不存在为 `IM_USER_NOT_FOUND`，调用超频为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [user_id, status]
                            properties:
                              user_id: { type: string }
                              status: { type: integer, enum: [0, 1] }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/users/{user_id}/token:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    post:
      tags: [服务端]
      operationId: serverIssueToken
      summary: 签用户令牌
      description: |
        无请求体。每次调用签一个新令牌，之前签的令牌照样有效直到过期；要让旧令牌全部作废请用踢下线。
        令牌是不透明字符串，客户端不要解析，以 `expires_at` 判断何时续签。有效期默认 168 小时，站点可配 1–8760 小时。
      security: [{ ApiKey: [] }]
      responses:
        '200':
          description: 成功返回令牌；用户不存在为 `IM_USER_NOT_FOUND`，已封禁为 `IM_USER_DISABLED`，调用超频为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [token, expires_at]
                            properties:
                              token: { type: string, description: 用户令牌（不透明字符串） }
                              expires_at: { $ref: '#/components/schemas/DateTime' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/users/{user_id}/kick:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    post:
      tags: [服务端]
      operationId: serverKickUser
      summary: 踢下线
      description: 无请求体。使该用户全部已签令牌失效并断开长连接，但用户仍正常、可重新签令牌。
      security: [{ ApiKey: [] }]
      responses:
        '200':
          description: 成功返回 user_id；用户不存在为 `IM_USER_NOT_FOUND`，调用超频为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data: { $ref: '#/components/schemas/UserIdData' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/users/{user_id}/blocks:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    get:
      tags: [服务端]
      operationId: serverListBlocks
      summary: 黑名单列表
      description: '`{user_id}` 是拉黑方。按拉黑时间倒序（同一秒按被拉黑方倒序），offset/limit 分页。拉黑方只校验格式，不要求已导入。'
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/BlockOffset'
        - $ref: '#/components/parameters/BlockLimit'
      responses:
        '200':
          description: 成功返回本页；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data: { $ref: '#/components/schemas/BlockPage' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/users/{user_id}/blocks/{target}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
      - $ref: '#/components/parameters/TargetPath'
    put:
      tags: [服务端]
      operationId: serverAddBlock
      summary: 拉黑
      description: |
        `{user_id}` 拉黑 `{target}`：此后 target 发给 user_id 的消息回 `IM_BLOCKED`；user_id 发给 target 不受影响。
        双方只校验格式、不要求已导入；不能拉黑自己、不能拉黑客服（均为 400 `VALIDATION`）。
        幂等：重复拉黑不报错、不改拉黑时间。不推送事件、不触发回调。
      security: [{ ApiKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkEmptyOrRateLimited' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      tags: [服务端]
      operationId: serverRemoveBlock
      summary: 解除拉黑
      description: 幂等：没有这条记录也返回成功。校验规则同拉黑。
      security: [{ ApiKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkEmptyOrRateLimited' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/users/{user_id}/conversations/{peer_id}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
      - $ref: '#/components/parameters/PeerIdPath'
    get:
      tags: [服务端]
      operationId: serverGetConversationSettings
      summary: 查询用户对某会话的设置
      description: |
        按「用户 + 对方」定位会话（`{peer_id}` 为对方 user_id，客服会话写 `@cs` 或 `@cs:<主体标识>`）。
        会话要双方有过消息才存在；查不到会话回 404 `VALIDATION`（所以不能提前给没聊过的人设免打扰）。
      security: [{ ApiKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkConversationSettingsOrRateLimited' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      tags: [服务端]
      operationId: serverDeleteConversation
      summary: 替用户删除会话
      description: 同客户端 `DELETE /conversations/{id}`：清空该用户这一侧的记录并从其列表移除、取消置顶，免打扰保留。向该用户频道推 `conversation_changed`。
      security: [{ ApiKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkConversationSettingsOrRateLimited' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/users/{user_id}/conversations/{peer_id}/settings:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
      - $ref: '#/components/parameters/PeerIdPath'
    put:
      tags: [服务端]
      operationId: serverSetConversationSettings
      summary: 替用户置顶 / 免打扰
      description: 同客户端 `PUT /conversations/{id}/settings`，`pinned`、`muted` 至少给一个。向该用户频道推 `conversation_changed`。
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned: { type: boolean }
                muted: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/OkConversationSettingsOrRateLimited' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/users/{user_id}/conversations/{peer_id}/clear:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
      - $ref: '#/components/parameters/PeerIdPath'
    post:
      tags: [服务端]
      operationId: serverClearConversation
      summary: 替用户清空聊天记录
      description: 同客户端 `POST /conversations/{id}/clear`。向该用户频道推 `conversation_changed`。
      security: [{ ApiKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkConversationSettingsOrRateLimited' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/messages:
    post:
      tags: [服务端]
      operationId: serverSendMessage
      summary: 以某用户身份代发消息
      description: |
        与客户端发消息走完全相同的流程（校验、幂等、黑名单、限速按 `from` 计、发送前回调、推送、发送后回调）。
        服务端拿不到用户的上传凭证，代发图片请用 `url` 形式，语音、文件、视频不能代发。`from` 或 `to` 为客服时一律回 `IM_USER_NOT_FOUND`。
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerSendMessageRequest' }
      responses:
        '200':
          description: |
            成功返回消息对象（幂等重放时返回第一次的那条）。业务失败（HTTP 200）：
            `IM_USER_NOT_FOUND`（收发方不存在，或涉及客服）、`IM_USER_DISABLED`、`IM_BLOCKED`（收件人已拉黑 from）、
            `IM_RATE_LIMITED`（接入应用或发送者超频）、`IM_MESSAGE_REJECTED`（被发送前回调拒绝）。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data: { $ref: '#/components/schemas/Message' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/messages/{id}/recall:
    parameters:
      - $ref: '#/components/parameters/MessageIdPath'
    post:
      tags: [服务端]
      operationId: serverRecallMessage
      summary: 撤回消息
      description: |
        不限时、不看「IM 设置」的撤回开关，用于处理违规内容。渠道用户（网页访客、微信）参与的会话、平台客服发的消息一律按不存在（404）；其他客服主体的坐席发的可以撤（`content.by` 为 `server`）。
        已撤回的再调返回同一结果，不再推送、不再回调。
      security: [{ ApiKey: [] }]
      responses:
        '200':
          description: 成功返回撤回后的消息对象（`type` 为 `recalled`）；业务失败为 `IM_RATE_LIMITED`（接入应用超频）。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data: { $ref: '#/components/schemas/Message' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '404':
          description: 消息不存在（`VALIDATION`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/server/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
    get:
      tags: [服务端]
      operationId: serverListMessages
      summary: 查会话历史（审计）
      description: 参数与客户端拉消息相同，不校验成员身份。会话不存在回 404 `VALIDATION`。
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/BeforeSeq'
        - $ref: '#/components/parameters/MessageLimit'
      responses:
        '200':
          description: 成功返回本页消息（按 seq 升序）；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data: { $ref: '#/components/schemas/MessagePage' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------- 客户端接口 ----------------
  /api/im/v1/me:
    get:
      tags: [客户端]
      operationId: getMe
      summary: 当前用户（令牌自检）
      security: [{ UserToken: [] }]
      responses:
        '200':
          description: 成功返回当前用户资料。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/messages:
    post:
      tags: [客户端]
      operationId: sendMessage
      summary: 发消息
      description: |
        `from` 取令牌里的用户。`to` 填 `@cs` 即发给平台客服，填 `@cs:<主体标识>` 发给那个客服主体（站点装了客服模块时）。
        同一发送者的 `client_msg_id` 全局唯一，重复提交直接返回第一次的那条消息（不再推送、不再回调）。
      security: [{ UserToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: |
            成功返回消息对象。业务失败（HTTP 200）：`IM_USER_NOT_FOUND`（接收方不存在）、`IM_USER_DISABLED`、
            `IM_BLOCKED`（接收方已把你拉黑）、`IM_RATE_LIMITED`（10 秒 20 条）、`IM_MESSAGE_REJECTED`（被发送前回调拒绝）。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data: { $ref: '#/components/schemas/Message' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/messages/{id}/recall:
    parameters:
      - $ref: '#/components/parameters/MessageIdPath'
    post:
      tags: [客户端]
      operationId: recallMessage
      summary: 撤回自己的消息
      description: |
        只能撤回本人发的、且在「IM 设置」的撤回时限内（`/me` 的 `features.recall_minutes`，0 = 没开启）。
        不是本人发的按不存在（404）。已撤回的再调返回同一结果。双方都会收到 `message_recalled` 推送。
      security: [{ UserToken: [] }]
      responses:
        '200':
          description: 成功返回撤回后的消息对象（`type` 为 `recalled`）；业务失败为 `IM_RECALL_NOT_ALLOWED`、`IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data: { $ref: '#/components/schemas/Message' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '404':
          description: 消息不存在（`VALIDATION`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/recalls:
    get:
      tags: [客户端]
      operationId: listRecalls
      summary: 撤回增量补齐
      description: |
        撤回不产生新的 seq，离线期间被撤回的消息用这个接口补齐：每次重连对账时带上次的 `next_cursor` 调一次，
        `has_more` 为 true 时接着翻。最近几秒的会重复给，按 `message_id` 覆盖即可；没有新的时 `next_cursor` 原样返回传入值。
        首次不传 cursor 返回全部。只更新本地已有的消息，本地没有的不用插入。
      security: [{ UserToken: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          description: 上次返回的 `next_cursor`，持久化保存
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: 默认 100，最大 200（超出按 200）
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: 成功返回本页撤回。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor, has_more]
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              required: [conversation_id, message_id, seq, message]
                              properties:
                                conversation_id: { type: integer, format: int64 }
                                message_id: { type: integer, format: int64 }
                                seq: { type: integer, format: int64 }
                                message: { $ref: '#/components/schemas/Message' }
                          next_cursor: { type: string, description: 下次调用带上；本页为空时等于传入值 }
                          has_more: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/upload:
    post:
      tags: [客户端]
      operationId: uploadImage
      summary: 上传图片 / 语音 / 文件 / 视频
      description: |
        图片只收 JPEG / PNG / GIF / WebP，大小上限取站点「图片上限」设置（默认 8MB）；语音（`kind=voice`）只收 m4a（AAC）与 mp3，
        不超过 2MB 与「图片上限」中较小的一个，网页访客不能传。都按文件内容识别。与发消息同口径单独限速（10 秒 20 次）。

        文件（`kind=file`）与视频（`kind=video`）要站点在「IM 设置」开启（默认关闭），大小上限见 `/me` 的 `features`，
        每人每天合计 100 个（网页访客沿用每天 20 次，与图片合计；文件要站点另外允许，不能传视频）。
        文件收 pdf、docx、xlsx、pptx、doc / xls / ppt / wps / et / dps、txt / csv / md / log、zip、rar，
        文件名（multipart 的 `filename`）的扩展名要和内容对得上；视频只收 mp4 与 mov，服务端不转码，请先转成 H.264 的 MP4。
      security: [{ UserToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片、语音、文件或视频
                kind:
                  type: string
                  enum: [image, voice, file, video]
                  default: image
      responses:
        '200':
          description: 成功返回附件 id、临时链接与上传凭证；超频、当天的文件与视频数到上限时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data: { $ref: '#/components/schemas/UploadResult' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/conversations:
    get:
      tags: [客户端]
      operationId: listConversations
      summary: 会话列表（游标分页）
      description: |
        只列出本人列表里的会话（有过消息、且没被本人删除），单聊与客服会话混排。
        **不带 cursor 的首页**先放全部置顶会话（按置顶时间倒序，最多 50 个），再接 `limit` 条非置顶会话；
        之后的页只翻非置顶会话，按最后一条消息时间倒序。
      security: [{ UserToken: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          description: 首页不传，之后传上一页返回的 `next_cursor`
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: 默认 20，最大 50（超出按 50）
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 成功返回本页会话。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Conversation' }
                          next_cursor:
                            type: string
                            description: 下一页游标；空串表示没有下一页
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/unread:
    get:
      tags: [客户端]
      operationId: getUnread
      summary: 总未读
      description: 本人所有**非免打扰**会话的未读之和，可直接用作 App 角标。免打扰会话自己的 `unread` 照常计数，只是不计入这里；与 after_send 的 `to_unread_total` 同一口径。
      security: [{ UserToken: [] }]
      responses:
        '200':
          description: 成功返回所有非免打扰会话的未读之和。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [total]
                        properties:
                          total: { type: integer, format: int64, description: 总未读数，不计免打扰会话 }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
    get:
      tags: [客户端]
      operationId: listMessages
      summary: 补拉 / 翻历史
      description: |
        `after_seq` 补拉（返回 seq > after_seq）、`before_seq` 翻历史（返回 seq < before_seq），都不传为最新一页，两者只能传一个。
        items 一律按 seq 升序。不是会话成员（或会话不存在）回 403 `FORBIDDEN`。
        本人清空过记录（或删除过会话）时只返回 `seq > clear_seq` 的消息：`after_seq` 小于 `clear_seq` 按 `clear_seq` 处理，
        翻历史翻到 `clear_seq + 1` 为止（此时 `has_more` 为 false）。对方与服务端审计查询不受影响。
      security: [{ UserToken: [] }]
      parameters:
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/BeforeSeq'
        - $ref: '#/components/parameters/MessageLimit'
      responses:
        '200':
          description: 成功返回本页消息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessagePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ForbiddenOrLicense' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/conversations/read-all:
    post:
      tags: [客户端]
      operationId: markAllRead
      summary: 一键清全部未读
      description: |
        无请求体。把该用户所有会话（含客服会话、免打扰会话，以及已删除不在列表里的会话）的已读位置推到各自最新一条。
        `updated > 0` 时向本人频道推一条 `read_all` 事件（见 `PushReadAll`），不逐会话推 `read`。
      security: [{ UserToken: [] }]
      responses:
        '200':
          description: 成功返回本次实际变更的会话数（没有未读时为 0）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [updated]
                        properties:
                          updated: { type: integer, format: int64, description: 本次变更的会话数 }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/conversations/{id}/read:
    parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
    post:
      tags: [客户端]
      operationId: markRead
      summary: 标已读
      description: 已读位置只进不退，超过会话最大 seq 时按最大 seq 处理。成功后向本人所有在线设备推 `read` 事件（见 `PushRead`）。
      security: [{ UserToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq: { type: integer, format: int64, minimum: 0, description: 通常传当前看到的最大 seq }
      responses:
        '200':
          description: 成功返回新的已读位置与该会话剩余未读。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [read_seq, unread]
                        properties:
                          read_seq: { type: integer, format: int64 }
                          unread: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ForbiddenOrLicense' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/conversations/{id}/typing:
    parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
    post:
      tags: [客户端]
      operationId: typing
      summary: 正在输入
      description: |
        告诉会话对方自己正在输入，不落库、不回调。输入时最多每 3 秒调一次，停止输入不用通知；对方收到 `typing` 推送，6 秒后没有新的就不再显示。
        对方不在线、把你拉黑时同样返回成功。客服会话会告诉正在接待的坐席。网页访客与微信用户不能调（400）。
      security: [{ UserToken: [] }]
      responses:
        '200':
          description: 成功；业务失败为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403':
          description: 不是会话成员（`FORBIDDEN`），或站点授权异常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/conversations/changes:
    get:
      tags: [客户端]
      operationId: conversationChanges
      summary: 会话设置增量补齐
      description: |
        返回本人置顶 / 免打扰 / 清空 / 删除过的会话的**当前**设置（含已删除、`visible: false` 的会话），按修改时间升序。
        给离线期间错过 `conversation_changed` 推送的设备用：每次重连对账时带上次的 `next_cursor` 调一次，
        `has_more` 为 true 时接着翻。同一秒内的修改可能重复返回，按 `conversation_id` 整行覆盖即可；
        没有新修改时 `next_cursor` 原样返回传入值。首次不传 cursor 返回全部改过设置的会话。
      security: [{ UserToken: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          description: 上次返回的 `next_cursor`，持久化保存
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: 默认 100，最大 200（超出按 200）
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: 成功返回本页变更。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, next_cursor, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ConversationSettings' }
                          next_cursor: { type: string, description: 下次调用带上；本页为空时等于传入值 }
                          has_more: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/conversations/{id}/settings:
    parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
    put:
      tags: [客户端]
      operationId: setConversationSettings
      summary: 置顶 / 免打扰
      description: |
        只改本人这一侧，对方看不到。`pinned`、`muted` 至少给一个，没给的不变。
        免打扰会话自己的 `unread` 照常计数，但不计入总未读（`GET /unread`）与 after_send 的 `to_unread_total`。
        置顶最多 50 个；只有出现在会话列表里的会话能置顶。
        成功后向本人频道推 `conversation_changed`（见 `PushConversationChanged`）。
      security: [{ UserToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned: { type: boolean }
                muted: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/OkConversationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ForbiddenOrLicense' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/conversations/{id}/clear:
    parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
    post:
      tags: [客户端]
      operationId: clearConversation
      summary: 清空聊天记录
      description: |
        无请求体。只清本人这一侧：`clear_seq` 与 `read_seq` 推到会话最新，之后拉消息只返回 `seq > clear_seq` 的消息；
        会话留在列表原位，`last_message` 为 null。对方不受影响，消息本身不删除。
        成功后向本人频道推 `conversation_changed`（见 `PushConversationChanged`）。
      security: [{ UserToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkConversationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ForbiddenOrLicense' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
    delete:
      tags: [客户端]
      operationId: deleteConversation
      summary: 删除会话
      description: |
        无请求体。= 清空聊天记录 + 从本人会话列表移除 + 取消置顶（免打扰保留）。对方不受影响。
        之后该会话有新消息时会重新出现在列表里，只能看到新消息。
        成功后向本人频道推 `conversation_changed`（见 `PushConversationChanged`）。
      security: [{ UserToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkConversationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ForbiddenOrLicense' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/blocks:
    get:
      tags: [客户端]
      operationId: listBlocks
      summary: 我的黑名单列表
      description: 拉黑方是令牌里的用户。按拉黑时间倒序，offset/limit 分页。
      security: [{ UserToken: [] }]
      parameters:
        - $ref: '#/components/parameters/BlockOffset'
        - $ref: '#/components/parameters/BlockLimit'
      responses:
        '200':
          description: 成功返回本页。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BlockPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/im/v1/blocks/{target}:
    parameters:
      - $ref: '#/components/parameters/TargetPath'
    put:
      tags: [客户端]
      operationId: addBlock
      summary: 拉黑
      description: 令牌用户拉黑 `{target}`，语义同服务端拉黑。`target` 不合法、是自己或是客服回 400 `VALIDATION`。幂等。
      security: [{ UserToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkEmpty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      tags: [客户端]
      operationId: removeBlock
      summary: 解除拉黑
      description: 幂等：没有这条记录也返回成功。
      security: [{ UserToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkEmpty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------- 客服接口 ----------------
  /api/imcs/v1/state:
    get:
      tags: [客服]
      operationId: csGetState
      summary: 当前接待状态
      description: 用于客服会话页顶部的状态条。服务端不推送状态变化，进入客服会话、收到 `@cs` 新消息时刷新即可。站点客服不可用时回 400 `VALIDATION`。
      security: [{ UserToken: [] }]
      parameters:
        - name: service_id
          in: query
          required: false
          description: 客服主体标识，缺省是平台客服
          schema: { type: string, pattern: '^[a-z0-9_-]{1,40}$' }
      responses:
        '200':
          description: 成功返回接待状态。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, session_id, queue_position, agents_online, leave_enabled]
                        properties:
                          status:
                            type: string
                            enum: [none, bot, queued, active]
                            description: none 当前没有进行中的咨询；bot 机器人接待中；queued 排队中；active 坐席接待中。不认识的取值按 none 处理
                          session_id:
                            type: integer
                            format: int64
                            description: 当前这次接待的 id；none 时为 0
                          queue_position:
                            type: integer
                            format: int64
                            description: 排队名次（含自己，排第一为 1）；非 queued 时为 0
                          agents_online: { type: boolean, description: 是否有坐席在（在线或忙碌）；都满额时仍为 true }
                          leave_enabled: { type: boolean, description: 站点是否开启了留言，见 POST /api/imcs/v1/leave }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/visitor:
    post:
      tags: [客服]
      operationId: csVisitor
      summary: 网页访客换令牌
      description: |
        网页客服挂件用，不需要令牌，不支持跨域调用。带上次返回的 `visitor_key` 认回同一访客；没带或无效则新建一个访客（按 IP 与全站限额）。
        返回的 `token` 是普通用户令牌，只能与客服往来。站点没开放网页客服回 404 `VALIDATION`；超过限额回 `IM_RATE_LIMITED`；访客已被封禁回 `IM_USER_DISABLED`（后两者 HTTP 200）。
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                visitor_key: { type: string, description: 上次返回的 visitor_key，存在浏览器本地 }
      responses:
        '200':
          description: 成功返回访客与令牌；业务失败见说明。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user_id, token, expires_at, visitor_key]
                        properties:
                          user_id: { type: string }
                          token: { type: string }
                          expires_at: { $ref: '#/components/schemas/DateTime' }
                          visitor_key: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '404': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/handoff:
    post:
      tags: [客服]
      operationId: csHandoff
      summary: 转人工
      description: 无请求体。机器人接待中时转给人工（排队或直接分配），返回转完的接待状态；当前没有机器人接待时不做任何事，返回当前状态。站点客服不可用时回 400 `VALIDATION`。
      security: [{ UserToken: [] }]
      responses:
        '200':
          description: 成功返回接待状态，形状同 `GET /api/imcs/v1/state`。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, session_id, queue_position, agents_online, leave_enabled]
                        properties:
                          status: { type: string, enum: [none, bot, queued, active] }
                          session_id: { type: integer, format: int64 }
                          queue_position: { type: integer, format: int64 }
                          agents_online: { type: boolean }
                          leave_enabled: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/leave:
    post:
      tags: [客服]
      operationId: csLeave
      summary: 留联系方式，把排队转成留言
      description: |
        没有坐席在、排队中时可用：把这次排队立刻结束并转成留言（工单），内容就是用户这次说的话。已经转成留言的，只更新那张单的联系方式。
        手机号与邮箱至少填一项。有坐席在、用户还没说过话、联系方式不合法、留言已处理完回 400 `VALIDATION`；站点没启用工单或没开启留言回 404 `VALIDATION`；同一用户每小时最多 5 次，超出回 `IM_RATE_LIMITED`（HTTP 200）。
      security: [{ UserToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact_name: { type: string, maxLength: 50, description: 称呼，选填 }
                contact_phone: { type: string, maxLength: 30, pattern: '^([0-9+\- ]{5,30})?$', description: 联系电话 }
                contact_email: { type: string, maxLength: 120, description: 邮箱 }
      responses:
        '200':
          description: 成功返回单号；业务失败见说明。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ticket_no]
                        properties:
                          ticket_no: { type: string, example: T20261124123456 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '404': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/sessions/{id}/rating:
    parameters:
      - name: id
        in: path
        required: true
        description: 接待 id，取评价邀请消息的 `content.data.session_id`
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [客服]
      operationId: csRateSession
      summary: 评价一次接待
      description: |
        每次接待只能评一次，只能评自己的、已结束的接待。重复评价、评别人的或未结束的回 400 `VALIDATION`（`message` 为「无法评价」），
        评分越界、评语超长同样回 400 `VALIDATION`。站点客服不可用时也回 400 `VALIDATION`。
      security: [{ UserToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5, description: 评分 1–5 }
                comment: { type: string, maxLength: 200, description: 评语，可选，≤200 字 }
      responses:
        '200':
          description: 成功返回被评价的接待 id。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id]
                        properties:
                          id: { type: integer, format: int64, description: 接待 id }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------- 客服主体：接入方后端 ----------------
  /api/imcs/v1/server/services/batch:
    post:
      tags: [客服主体]
      operationId: csBatchServices
      summary: 批量导入主体与坐席
      description: |
        首次接入用，逐个调会撞调用频率上限。每批最多 100 个主体、合计 500 个坐席。
        按顺序处理，遇到错误即停并指出第几个；重复提交没有副作用，可整批重试。
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceBatch' }
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [services, agents]
                            properties:
                              services: { type: integer }
                              agents: { type: integer }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/server/services/{sid}:
    put:
      tags: [客服主体]
      operationId: csPutService
      summary: 建或改主体
      description: |
        不存在则新建（启用状态），存在则改名称、头像与设置；不改启停。没传 `settings` 时不改设置，传了就整个替换。
        用户给返回的 `user_id` 发消息，就是在找这个主体的客服。
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [service_id, user_id]
                            properties:
                              service_id: { type: string }
                              user_id: { type: string, example: '@cs:shop_1001' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      tags: [客服主体]
      operationId: csPatchService
      summary: 启用或停用主体
      description: |
        停用后用户发不进来，未结束的接待静默结束，坐席断开。平台停用的（`blocked` 为 1）你方启用了也不接待。
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: integer, enum: [0, 1], description: 1 启用，0 停用 } } }
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [service_id, status]
                            properties:
                              service_id: { type: string }
                              status: { type: integer, enum: [0, 1] }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/server/services:
    get:
      tags: [客服主体]
      operationId: csListServices
      summary: 主体列表
      description: 对账用，按建立先后翻页。
      security: [{ ApiKey: [] }]
      parameters:
        - { name: cursor, in: query, required: false, description: 上一页的 next_cursor, schema: { type: string } }
        - { name: limit, in: query, required: false, description: 默认 50，最大 100, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`，主体不存在为 `CS_SERVICE_NOT_FOUND`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [items, next_cursor]
                            properties:
                              items:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    service_id: { type: string }
                                    name: { type: string }
                                    status: { type: integer, enum: [0, 1] }
                                    blocked: { type: integer, enum: [0, 1], description: 1 为平台停用 }
                                    updated_at: { $ref: '#/components/schemas/DateTime' }
                              next_cursor: { type: string, description: 空串是没有了 }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/server/services/{sid}/agents:
    get:
      tags: [客服主体]
      operationId: csListAgents
      summary: 坐席列表
      description: 在职的全部坐席。
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceIdPath'
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`，主体不存在为 `CS_SERVICE_NOT_FOUND`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [items]
                            properties:
                              items:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    external_id: { type: string }
                                    nickname: { type: string }
                                    agent_id: { type: integer, format: int64 }
                                    max_concurrent: { type: integer }
                                    status: { type: string, enum: [online, away, offline], description: 他自己设的 }
                                    connected: { type: boolean, description: 工作台此刻连着没有 }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }
    put:
      tags: [客服主体]
      operationId: csReplaceAgents
      summary: 坐席整份替换
      description: |
        多的移除，少的补上，没变的不动；空数组是全部移除。最多 500 个，`external_id` 不区分大小写、不能重复。
        先全部校验再逐个做，中途出错可整份重试。
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agents]
              properties:
                agents:
                  type: array
                  maxItems: 500
                  items:
                    allOf:
                      - $ref: '#/components/schemas/ServiceAgentInput'
                      - type: object
                        required: [external_id]
                        properties:
                          external_id: { type: string, pattern: '^[A-Za-z0-9_.@-]{1,64}$' }
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`，主体不存在为 `CS_SERVICE_NOT_FOUND`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [added, updated, removed]
                            properties:
                              added: { type: integer }
                              updated: { type: integer }
                              removed: { type: integer }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/server/services/{sid}/sessions:
    get:
      tags: [客服主体]
      operationId: csListOpenSessions
      summary: 未结束的接待
      description: 排队中与接待中的，最近有消息的在前，最多 200 条。
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceIdPath'
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`，主体不存在为 `CS_SERVICE_NOT_FOUND`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [items]
                            properties:
                              items:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    session_id: { type: integer, format: int64 }
                                    user_id: { type: string }
                                    status: { type: string, enum: [queued, active] }
                                    agent_external_id: { type: string, description: 接待的员工；排队中为空串 }
                                    agent_online: { type: boolean, description: 该员工的工作台此刻连着没有 }
                                    unread: { type: integer, description: 用户说了还没人看的条数 }
                                    queued_at: { $ref: '#/components/schemas/DateTime' }
                                    last_msg_at: { $ref: '#/components/schemas/DateTime' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/server/services/{sid}/summary:
    get:
      tags: [客服主体]
      operationId: csServiceSummary
      summary: 主体资料与此刻的接待情况
      description: |
        主体不存在回 `CS_SERVICE_NOT_FOUND`。
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceIdPath'
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [service_id, user_id, name, avatar_url, status, blocked, settings, agents, agents_online, queue_count]
                            properties:
                              service_id: { type: string }
                              user_id: { type: string }
                              name: { type: string }
                              avatar_url: { type: string }
                              status: { type: integer, enum: [0, 1], description: 你方的启停 }
                              blocked: { type: integer, enum: [0, 1], description: 1 为平台停用，你方打不开；两个都开着才接待 }
                              settings: { $ref: '#/components/schemas/ServiceSettings' }
                              agents: { type: integer, description: 坐席数 }
                              agents_online: { type: integer, description: 在线且能接待的坐席数 }
                              queue_count: { type: integer, format: int64, description: 排队中的接待数 }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/server/services/{sid}/agents/{external_id}:
    put:
      tags: [客服主体]
      operationId: csPutAgent
      summary: 建或改坐席
      description: |
        坐席是你方的员工，不需要在客服后台建账号。已移除的再次调用会重新启用。主体须已存在。
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceIdPath'
        - $ref: '#/components/parameters/ExternalIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAgentInput' }
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [service_id, external_id, agent_id]
                            properties:
                              service_id: { type: string }
                              external_id: { type: string }
                              agent_id: { type: integer, format: int64, description: 坐席 ID，移除后重新加回来不变 }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      tags: [客服主体]
      operationId: csDeleteAgent
      summary: 移除坐席
      description: |
        令牌失效、断开连接，接待中的转回排队重新分配。历史接待里仍显示这名坐席。本来就不在的也算成功。
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceIdPath'
        - $ref: '#/components/parameters/ExternalIdPath'
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [service_id, external_id]
                            properties:
                              service_id: { type: string }
                              external_id: { type: string }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/imcs/v1/server/services/{sid}/agents/{external_id}/token:
    post:
      tags: [客服主体]
      operationId: csAgentToken
      summary: 签坐席令牌
      description: |
        坐席打开工作台前由你方后端调用，令牌交给工作台页面。有效 2 小时，页面会自动续期，从签发起最长 12 小时；
        移除坐席或停用主体立即失效。无请求体。
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceIdPath'
        - $ref: '#/components/parameters/ExternalIdPath'
      responses:
        '200':
          description: 成功；调用超频时为 `IM_RATE_LIMITED`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/OkEnvelope'
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [token, expires_at]
                            properties:
                              token: { type: string }
                              expires_at: { $ref: '#/components/schemas/DateTime' }
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/KeyInvalid' }
        '403': { $ref: '#/components/responses/LicenseError' }
        '500': { $ref: '#/components/responses/Internal' }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 接入应用的 API Key（形如 `imk_…`），只放在接入方后端，不要下发到客户端。
    UserToken:
      type: http
      scheme: bearer
      description: '接入方后端调「签用户令牌」拿到的用户令牌，放在 `Authorization: Bearer <令牌>`。'

  parameters:
    ServiceIdPath:
      name: sid
      in: path
      required: true
      description: 主体标识，由你方定，建好后不能改
      schema: { type: string, pattern: '^[a-z0-9_-]{1,40}$' }
    ExternalIdPath:
      name: external_id
      in: path
      required: true
      description: 你方的员工标识，同一主体内唯一
      schema: { type: string, pattern: '^[A-Za-z0-9_.@-]{1,64}$' }
    UserIdPath:
      name: user_id
      in: path
      required: true
      description: 用户 id，限 `[A-Za-z0-9_-]{1,64}`
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    TargetPath:
      name: target
      in: path
      required: true
      description: 被拉黑方 user_id，限 `[A-Za-z0-9_-]{1,64}`（所以客服号不合法）
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    PeerIdPath:
      name: peer_id
      in: path
      required: true
      description: 会话对方的 user_id；该用户的客服会话写 `@cs`，其他客服主体写 `@cs:<主体标识>`
      schema: { type: string, pattern: '^(@cs(:[a-z0-9_-]{1,40})?|[A-Za-z0-9_-]{1,64})$' }
    MessageIdPath:
      name: id
      in: path
      required: true
      description: 消息 id
      schema: { type: integer, format: int64 }
    ConversationIdPath:
      name: id
      in: path
      required: true
      description: 会话 id（conversation_id）
      schema: { type: integer, format: int64 }
    AfterSeq:
      name: after_seq
      in: query
      required: false
      description: 补拉：返回 seq > after_seq 的消息；与 before_seq 只能传一个
      schema: { type: integer, format: int64, minimum: 0 }
    BeforeSeq:
      name: before_seq
      in: query
      required: false
      description: 翻历史：返回 seq < before_seq 的消息；与 after_seq 只能传一个
      schema: { type: integer, format: int64, minimum: 0 }
    MessageLimit:
      name: limit
      in: query
      required: false
      description: 默认 30，最大 100（超出按 100）
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    BlockOffset:
      name: offset
      in: query
      required: false
      description: 跳过的条数，默认 0；`has_more` 为 true 时加上本页条数取下一页
      schema: { type: integer, minimum: 0, default: 0 }
    BlockLimit:
      name: limit
      in: query
      required: false
      description: 默认 50，最大 200（超出按 200）
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    OkConversationSettings:
      description: 成功返回该会话在本人这一侧的设置。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/OkEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ConversationSettings' }
    OkConversationSettingsOrRateLimited:
      description: 成功返回会话设置；或 `IM_RATE_LIMITED`（HTTP 200，code 非 0）。
      content:
        application/json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConversationSettings' }
              - $ref: '#/components/schemas/ErrorEnvelope'
    OkEmpty:
      description: 成功，`data` 为 `{}`。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/OkEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/EmptyObject' }
    OkEmptyOrRateLimited:
      description: 成功时 `data` 为 `{}`；接入应用调用超频时为 `IM_RATE_LIMITED`。
      content:
        application/json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EmptyObject' }
              - $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: '`VALIDATION`：参数不合法，`message` 说明原因。'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    KeyInvalid:
      description: '`IM_KEY_INVALID`：`X-Api-Key` 缺失、错误，或接入应用已停用。'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TokenInvalid:
      description: '`IM_TOKEN_INVALID`：用户令牌缺失、验签失败、已过期，或用户已被封禁 / 踢下线，向接入方后端换新令牌后重试。'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    LicenseError:
      description: '`LICENSE_INVALID` / `LICENSE_EXPIRED` / `LICENSE_DOMAIN`：IM 站点授权异常，联系 IM 服务提供方。'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ForbiddenOrLicense:
      description: '`FORBIDDEN`：不是该会话成员（或会话不存在）；或 `LICENSE_*`：站点授权异常。'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: '`VALIDATION`：会话不存在（HTTP 404）。'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Internal:
      description: '`INTERNAL`：服务端错误（含令牌校验时数据库暂时不可用），可稍后重试；不要当成令牌失效处理。'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    ServiceSettings:
      type: object
      description: 主体自己的设置；没给的项用站点设置，文案给空串是不发。
      properties:
        welcome_text: { type: string, maxLength: 200 }
        queue_text: { type: string, maxLength: 200 }
        offline_text: { type: string, maxLength: 200 }
        timeout_text: { type: string, maxLength: 200, description: 超时自动结束时的提示 }
        transfer_text: { type: string, maxLength: 200, description: 转接、同事接管时的提示 }
        timeout_minutes: { type: integer, minimum: 1, maximum: 1440, description: 坐席最后一条之后多久没动静自动结束；用户说了没人回的不会超时 }
        rating_enabled: { type: boolean, description: 结束后是否邀请评价 }
        visitor_enabled: { type: boolean, description: 是否允许没登录的网页访客咨询，默认不允许 }
    ServiceInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: 用户看到的客服名称 }
        avatar_url: { type: string, maxLength: 512, description: http(s) 链接 }
        settings: { $ref: '#/components/schemas/ServiceSettings' }
    ServiceAgentInput:
      type: object
      required: [nickname]
      properties:
        nickname: { type: string, minLength: 1, maxLength: 32 }
        max_concurrent: { type: integer, minimum: 1, maximum: 50, description: 同时接待上限；新建缺省 5，已有的没传不改 }
    ServiceBatch:
      type: object
      required: [services]
      properties:
        services:
          type: array
          minItems: 1
          maxItems: 100
          items:
            allOf:
              - $ref: '#/components/schemas/ServiceInput'
              - type: object
                required: [service_id]
                properties:
                  service_id: { type: string, pattern: '^[a-z0-9_-]{1,40}$' }
                  agents:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ServiceAgentInput'
                        - type: object
                          required: [external_id]
                          properties:
                            external_id: { type: string, pattern: '^[A-Za-z0-9_.@-]{1,64}$' }
    DateTime:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
      description: Asia/Shanghai 时间，`YYYY-MM-DD HH:mm:ss`
      examples: ['2026-11-20 10:00:00']

    EmptyObject:
      type: object
      maxProperties: 0
      description: 空对象 `{}`

    OkEnvelope:
      type: object
      description: 成功响应包。`code` 恒为整数 0，`data` 的形状见各接口。
      required: [code, message, data]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          const: ok
        data:
          type: object

    ErrorCode:
      type: string
      description: |
        失败响应的业务码（字符串）。HTTP 状态与业务码的对应：
        - `VALIDATION`：400 参数不合法；404 会话不存在（服务端审计查询）、消息不存在（撤回）
        - `IM_KEY_INVALID`：401
        - `IM_TOKEN_INVALID`：401
        - `IM_USER_NOT_FOUND`、`IM_USER_DISABLED`、`IM_MESSAGE_REJECTED`、`IM_RATE_LIMITED`、`IM_BLOCKED`、`IM_RECALL_NOT_ALLOWED`、`CS_SERVICE_NOT_FOUND`、`CS_SERVICE_DISABLED`、`CS_AGENT_NOT_FOUND`：200
        - `FORBIDDEN`：403 不是会话成员
        - `LICENSE_INVALID`、`LICENSE_EXPIRED`、`LICENSE_DOMAIN`：403 站点授权异常
        - `INTERNAL`：500
      enum:
        - VALIDATION
        - IM_KEY_INVALID
        - IM_TOKEN_INVALID
        - IM_USER_NOT_FOUND
        - IM_USER_DISABLED
        - IM_MESSAGE_REJECTED
        - IM_RATE_LIMITED
        - IM_BLOCKED
        - IM_RECALL_NOT_ALLOWED
        - CS_SERVICE_NOT_FOUND
        - CS_SERVICE_DISABLED
        - CS_AGENT_NOT_FOUND
        - FORBIDDEN
        - INTERNAL
        - LICENSE_INVALID
        - LICENSE_EXPIRED
        - LICENSE_DOMAIN

    ErrorEnvelope:
      type: object
      description: 失败响应包。`code` 为字符串错误码，`message` 为中文说明，`data` 恒为 `{}`。
      required: [code, message, data]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          description: 中文说明。`IM_MESSAGE_REJECTED` 形如「消息被拒绝：<原因>」，`IM_BLOCKED` 为「对方已将你拉黑」。
        data: { $ref: '#/components/schemas/EmptyObject' }

    UserInput:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        nickname: { type: string, maxLength: 64, description: 可空，≤64 字 }
        avatar_url: { type: string, maxLength: 512, description: 可空，http(s) 且 ≤512 字符 }

    UserIdData:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }

    User:
      type: object
      required: [user_id, nickname, avatar_url]
      properties:
        user_id: { type: string, description: "用户 id；平台客服为 `@cs`，其他客服主体为 `@cs:<主体标识>`" }
        nickname: { type: string, description: 昵称，可能为空串 }
        avatar_url: { type: string, description: 头像链接，可能为空串 }

    Me:
      description: 当前用户与站点开关
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [features]
          properties:
            features:
              type: object
              description: 站点在「IM 设置」里的开关；旧版服务端没有这个字段
              properties:
                recall_minutes: { type: integer, minimum: 0, description: 撤回时限（分钟），0 = 没开启 }
                read_receipt: { type: boolean, description: 是否显示对方已读 }
                file_max_mb: { type: integer, minimum: 0, maximum: 100, description: 当前用户能发的文件大小上限（MB），0 = 不能发；v1.19.0 之前的服务端没有 }
                video_max_mb: { type: integer, minimum: 0, maximum: 100, description: 当前用户能发的视频大小上限（MB），0 = 不能发；v1.19.0 之前的服务端没有 }

    UploadResult:
      type: object
      required: [attachment_id, url, ticket]
      properties:
        attachment_id: { type: integer, format: int64, description: 附件 id，发图片 / 语音 / 文件 / 视频消息时带上；也可作视频封面 }
        url: { type: string, description: 临时链接，仅供本地预览；kind=file 时是强制下载的地址 }
        ticket: { type: string, description: 上传凭证，与上传者绑定，发图片 / 语音 / 文件 / 视频消息时带上 }

    BlockItem:
      type: object
      required: [user_id, created_at]
      properties:
        user_id: { type: string, description: 被拉黑方 user_id（不带昵称头像，请用自己的用户资料展示） }
        created_at: { $ref: '#/components/schemas/DateTime' }

    BlockPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BlockItem' }
        has_more: { type: boolean, description: 是否还有下一页 }

    # ---- 消息内容 ----
    TextContent:
      type: object
      title: text
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000, description: 1–5000 字，不能全是空白 }

    ImageUploadContent:
      type: object
      title: image（上传图，发送时）
      description: 发送上传图时的形态；`attachment_id` 与 `ticket` 来自上传接口，且必须是发送者本人上传的。
      required: [attachment_id, ticket, width, height]
      properties:
        attachment_id: { type: integer, format: int64 }
        ticket: { type: string }
        width: { type: integer, minimum: 1, maximum: 20000 }
        height: { type: integer, minimum: 1, maximum: 20000 }

    ImageAttachmentContent:
      type: object
      title: image（上传图，读取时）
      description: 读取到的上传图形态；`url` 是每次读取时现签的临时链接（约 24 小时有效），不要长期保存。
      required: [attachment_id, width, height, url]
      properties:
        attachment_id: { type: integer, format: int64 }
        width: { type: integer, minimum: 1, maximum: 20000 }
        height: { type: integer, minimum: 1, maximum: 20000 }
        url: { type: string, description: 现签临时链接；签名失败时为空串 }

    VoiceUploadContent:
      type: object
      title: voice（发送时）
      description: 语音；attachment_id 与 ticket 来自 `/upload`（kind=voice），必须是发送者本人上传的。服务端代发不支持。
      required: [attachment_id, ticket, duration]
      properties:
        attachment_id: { type: integer, format: int64 }
        ticket: { type: string }
        duration: { type: integer, minimum: 1, maximum: 60, description: 秒，客户端上报 }

    VoiceContent:
      type: object
      title: voice（读取时）
      required: [attachment_id, duration, size, mime, url]
      properties:
        attachment_id: { type: integer, format: int64 }
        duration: { type: integer, minimum: 1, maximum: 60, description: 秒 }
        size: { type: integer, format: int64, description: 字节 }
        mime: { type: string, enum: [audio/mp4, audio/mpeg, audio/wave], description: audio/wave 只出现在微信用户发来的语音里（8kHz 单声道） }
        url: { type: string, description: 现签临时链接（约 24 小时有效）；签名失败时为空串 }

    FileUploadContent:
      type: object
      title: file（发送时）
      description: 文件；attachment_id 与 ticket 来自 `/upload`（kind=file），必须是发送者本人上传的。站点没开启、服务端代发不支持，网页访客要站点另外允许。
      required: [attachment_id, ticket, name]
      properties:
        attachment_id: { type: integer, format: int64 }
        ticket: { type: string }
        name: { type: string, minLength: 1, description: 显示与下载用的文件名，扩展名要和内容对得上；去掉路径与控制字符，超过 100 字截短 }

    FileContent:
      type: object
      title: file（读取时）
      required: [attachment_id, name, size, mime, url]
      properties:
        attachment_id: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 100 }
        size: { type: integer, format: int64, description: 字节 }
        mime:
          type: string
          description: 类型与扩展名的对照见接入文档 §5.6
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
            - application/x-ole-storage
            - text/plain
            - application/zip
            - application/x-rar-compressed
        url: { type: string, description: 现签的下载地址（约 24 小时有效），强制下载、带原文件名；签名失败时为空串 }

    VideoUploadContent:
      type: object
      title: video（发送时）
      description: 视频；attachment_id 与 ticket 来自 `/upload`（kind=video），封面是一张用 `/upload` 上传的图片（可选），都必须是发送者本人上传的。站点没开启、网页访客、服务端代发不支持。
      required: [attachment_id, ticket, duration, width, height]
      properties:
        attachment_id: { type: integer, format: int64 }
        ticket: { type: string }
        duration: { type: integer, minimum: 1, maximum: 3600, description: 秒，客户端上报 }
        width: { type: integer, minimum: 1, maximum: 20000 }
        height: { type: integer, minimum: 1, maximum: 20000 }
        cover_attachment_id: { type: integer, format: int64, description: 没有封面就不带 }
        cover_ticket: { type: string, description: 带了 cover_attachment_id 时必填 }

    VideoContent:
      type: object
      title: video（读取时）
      description: 服务端不转码，对方发来的视频（如 HEVC）不一定放得了，播放失败时请给下载链接。
      required: [attachment_id, duration, width, height, size, mime, cover_attachment_id, url, cover_url]
      properties:
        attachment_id: { type: integer, format: int64 }
        duration: { type: integer, minimum: 1, maximum: 3600, description: 秒 }
        width: { type: integer, minimum: 1, maximum: 20000 }
        height: { type: integer, minimum: 1, maximum: 20000 }
        size: { type: integer, format: int64, description: 字节 }
        mime: { type: string, enum: [video/mp4, video/quicktime] }
        cover_attachment_id: { type: integer, format: int64, description: 没有封面为 0 }
        url: { type: string, description: 现签临时链接（约 24 小时有效）；签名失败时为空串 }
        cover_url: { type: string, description: 封面的现签临时链接；没有封面、签名失败时为空串 }

    RecalledContent:
      type: object
      title: recalled（已撤回）
      required: [by]
      properties:
        by: { type: string, enum: [sender, agent, server], description: sender 发送者 / agent 坐席 / server 接入方 }

    ImageUrlContent:
      type: object
      title: image（外链图）
      description: 外链图，发送与读取形态相同，原样存取。与 attachment_id 二选一。
      required: [url, width, height]
      not: { required: [attachment_id] }
      properties:
        url: { type: string, maxLength: 1024, description: https 链接，≤1024 字符 }
        width: { type: integer, minimum: 1, maximum: 20000 }
        height: { type: integer, minimum: 1, maximum: 20000 }

    LocationContent:
      type: object
      title: location
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        name: { type: string, maxLength: 100, description: 地点名，≤100 字 }
        address: { type: string, maxLength: 200, description: 地址，≤200 字 }

    CustomContent:
      type: object
      title: custom
      required: [data, desc]
      properties:
        data:
          type: object
          description: 必须是 JSON 对象，压缩序列化后 ≤8KB（含 im_card）。其余键归接入方自用；im_card 是保留键，见接入文档 §5.9
          additionalProperties: true
          properties:
            im_card: { $ref: '#/components/schemas/ImCard' }
        desc:
          type: string
          minLength: 1
          maxLength: 100
          description: 1–100 字，用于会话预览与离线推送文字

    ImCard:
      type: object
      title: im_card
      description: |
        业务卡片通用外壳（接入文档 §5.9）。键存在就必须是对象；不合规范整条消息回 400 `VALIDATION`。
        未列出的键原样保存、渲染方忽略。服务端只校验格式与长度，不判断链接能否打开。
      required: [title]
      additionalProperties: true
      properties:
        title: { type: string, minLength: 1, maxLength: 64, description: 去首尾空白后 1–64 字 }
        kind: { type: string, maxLength: 20, description: 推荐 order / product / service / article / page，只用于显示类型名；其他值显示为「链接」；ticket 由站点工单进展使用 }
        subtitle: { type: string, maxLength: 100, description: ≤100 字 }
        image: { type: string, format: uri, maxLength: 1024, description: https 链接 }
        fields:
          type: array
          maxItems: 6
          description: 关键信息，发送时快照
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string, minLength: 1, maxLength: 10 }
              value: { type: string, minLength: 1, maxLength: 64 }
        web_link: { type: string, format: uri, maxLength: 1024, description: https；网站 / H5 / 客服工作台打开 }
        app_link: { type: string, maxLength: 1024, description: 原生 App 内跳转，不含空白，scheme 不限 }
        mp_path: { type: string, maxLength: 512, pattern: '^/\S*$', description: 小程序页面路径，以 / 开头、不含空白 }
        mp_appid: { type: string, maxLength: 32, pattern: '^[A-Za-z0-9]+$', description: 跳另一个小程序时填；只有带了 mp_path 才能填 }

    SendMessageRequest:
      type: object
      description: 发消息请求。content 按 type 取对应形态，多余字段会被丢弃。
      required: [to, type, content, client_msg_id]
      properties:
        to: { type: string, description: "接收方 user_id，不能是自己；客户端可填 `@cs` 或 `@cs:<主体标识>` 发给客服" }
        type:
          type: string
          enum: [text, image, voice, file, video, location, custom]
        content:
          description: text → TextContent；image → ImageUploadContent 或 ImageUrlContent（二选一）；voice → VoiceUploadContent；file → FileUploadContent；video → VideoUploadContent；location → LocationContent；custom → CustomContent
          anyOf:
            - $ref: '#/components/schemas/TextContent'
            - $ref: '#/components/schemas/ImageUploadContent'
            - $ref: '#/components/schemas/ImageUrlContent'
            - $ref: '#/components/schemas/VoiceUploadContent'
            - $ref: '#/components/schemas/FileUploadContent'
            - $ref: '#/components/schemas/VideoUploadContent'
            - $ref: '#/components/schemas/LocationContent'
            - $ref: '#/components/schemas/CustomContent'
        client_msg_id: { type: string, minLength: 1, maxLength: 64, description: 客户端生成的唯一 id（建议 UUID），重试时沿用同一个 }

    ServerSendMessageRequest:
      description: 代发请求，比客户端发消息多一个 `from`。代发图片请用外链图形态，语音、文件、视频不能代发。
      allOf:
        - $ref: '#/components/schemas/SendMessageRequest'
        - type: object
          required: [from]
          properties:
            from: { type: string, description: 发送者 user_id，不能是客服 }

    Message:
      type: object
      description: 消息对象。发消息的返回、拉消息列表、推送、回调里都是这个形状。
      required: [id, conversation_id, seq, from, type, content, client_msg_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        conversation_id: { type: integer, format: int64 }
        seq: { type: integer, format: int64, description: 会话内序号，从 1 开始连续递增 }
        from: { type: string, description: "发送者 user_id；客服发来的为 `@cs` 或 `@cs:<主体标识>`" }
        type:
          type: string
          enum: [text, image, voice, file, video, location, custom, recalled]
          description: recalled 为已撤回；将来可能增加取值，不认识的兜底显示
        content:
          description: text → TextContent；image → ImageAttachmentContent 或 ImageUrlContent；voice → VoiceContent；file → FileContent；video → VideoContent；recalled → RecalledContent；location → LocationContent；custom → CustomContent
          anyOf:
            - $ref: '#/components/schemas/TextContent'
            - $ref: '#/components/schemas/ImageAttachmentContent'
            - $ref: '#/components/schemas/ImageUrlContent'
            - $ref: '#/components/schemas/VoiceContent'
            - $ref: '#/components/schemas/FileContent'
            - $ref: '#/components/schemas/VideoContent'
            - $ref: '#/components/schemas/RecalledContent'
            - $ref: '#/components/schemas/LocationContent'
            - $ref: '#/components/schemas/CustomContent'
        client_msg_id: { type: string }
        sender_role:
          type: string
          enum: [agent, bot, system]
          description: 只有客服的消息带。agent 坐席 / bot 机器人（内容由 AI 生成，界面要标识）/ system 系统提示；将来可能增加取值，不认识的按 system 处理
        created_at: { $ref: '#/components/schemas/DateTime' }

    MessagePage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          description: 一律按 seq 升序
          items: { $ref: '#/components/schemas/Message' }
        has_more:
          type: boolean
          description: 查询方向上是否还有更多：补拉时表示后面还有新消息；翻历史 / 最新一页时表示更早还有

    LastMessage:
      type: object
      required: [seq, from, type, preview, created_at]
      properties:
        seq: { type: integer, format: int64 }
        from: { type: string }
        type:
          type: string
          enum: [text, image, voice, file, video, location, custom, recalled]
        preview:
          type: string
          description: 会话预览文字：text 取前 50 字，image 为「[图片]」，voice 为「[语音]」，file 为「[文件] 文件名」（合计截到 50 字），video 为「[视频]」，location 为「[位置]」，custom 取 desc，已撤回为「[消息已撤回]」
        created_at: { $ref: '#/components/schemas/DateTime' }

    Conversation:
      type: object
      description: 会话列表的一项。客服会话 `type` 为 `service`、`peer.user_id` 为 `@cs` 或 `@cs:<主体标识>`。
      required: [conversation_id, type, peer, last_message, unread, max_seq, read_seq, last_msg_at, clear_seq, pinned, pinned_at, muted]
      properties:
        conversation_id: { type: integer, format: int64 }
        type:
          type: string
          enum: [c2c, service]
          description: c2c 普通单聊；service 平台客服会话
        peer: { $ref: '#/components/schemas/User' }
        last_message:
          description: 最后一条消息摘要，请判空：本人清空过记录（最后一条 seq 不超过 clear_seq）时为 null，极少数情况下也可能为 null
          oneOf:
            - $ref: '#/components/schemas/LastMessage'
            - type: 'null'
        unread: { type: integer, format: int64, description: 未读数 = max_seq − read_seq }
        max_seq: { type: integer, format: int64 }
        read_seq: { type: integer, format: int64 }
        last_msg_at: { $ref: '#/components/schemas/DateTime' }
        clear_seq: { type: integer, format: int64, description: 本人清空到的序号，拉消息只会返回比它大的 seq；没清空过为 0 }
        pinned: { type: boolean, description: 本人是否置顶 }
        pinned_at:
          description: 置顶时间，未置顶为 null
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        muted: { type: boolean, description: 本人是否免打扰；免打扰会话的 unread 照常计数，但不计入总未读 }
        peer_read_seq: { type: integer, format: int64, description: 对方读到哪条；站点没开启对方已读、以及客服会话没有这个字段 }

    ConversationSettings:
      type: object
      description: 某用户在某会话里的设置（只属于本人，对方看不到）。
      required: [conversation_id, peer_user_id, pinned, pinned_at, muted, clear_seq, unread, visible]
      properties:
        conversation_id: { type: integer, format: int64 }
        peer_user_id: { type: string, description: "对方 user_id，客服会话为 `@cs` 或 `@cs:<主体标识>`" }
        pinned: { type: boolean }
        pinned_at:
          description: 置顶时间，未置顶为 null
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        muted: { type: boolean, description: 免打扰 }
        clear_seq: { type: integer, format: int64, description: 清空到的序号，seq 不超过它的消息本人看不到 }
        unread: { type: integer, format: int64 }
        visible: { type: boolean, description: 是否出现在本人会话列表里（删除后为 false，有新消息时恢复） }

    PushConversationChanged:
      type: object
      description: |
        **经长连接下发**，见接入文档 §6。本人置顶 / 免打扰 / 清空 / 删除会话成功后推给本人所有在线设备（不推给对方），
        `conversation` 带完整设置，客户端直接覆盖本地。`clear` / `delete` 时删除本地 `seq <= clear_seq` 的消息，`delete` 时把会话移出列表。
      required: [event, action, conversation]
      properties:
        event: { type: string, const: conversation_changed }
        action:
          type: string
          enum: [settings, clear, delete]
        conversation: { $ref: '#/components/schemas/ConversationSettings' }

    # ---- 长连接推送事件 ----
    PushMessage:
      type: object
      description: |
        **经长连接下发**（不是 HTTP 响应），见接入文档 §6。新消息事件，同时推给收发双方的所有在线设备；
        发送设备自己也会收到，按 `message.id`（或 `client_msg_id`）与 HTTP 返回去重。`seq` 大于本地最大 seq + 1 时说明漏了，需补拉。
      required: [event, conversation_id, seq, message]
      properties:
        event: { type: string, const: message }
        conversation_id: { type: integer, format: int64 }
        seq: { type: integer, format: int64 }
        message: { $ref: '#/components/schemas/Message' }

    PushRead:
      type: object
      description: '**经长连接下发**，见接入文档 §6。标已读后推给本人所有在线设备，用于多端同步角标。'
      required: [event, conversation_id, read_seq]
      properties:
        event: { type: string, const: read }
        conversation_id: { type: integer, format: int64 }
        read_seq: { type: integer, format: int64 }

    PushMessageRecalled:
      type: object
      description: |
        **经长连接下发**，见接入文档 §6。消息被撤回，推给双方所有在线设备（含发起设备）。按 `message.id` 替换本地那条，
        撤回不可逆；本地没有这个会话时忽略。离线漏掉的用 `GET /api/im/v1/recalls` 补齐。
      required: [event, conversation_id, seq, message]
      properties:
        event: { type: string, const: message_recalled }
        conversation_id: { type: integer, format: int64 }
        seq: { type: integer, format: int64 }
        message: { $ref: '#/components/schemas/Message' }

    PushPeerRead:
      type: object
      description: '**经长连接下发**，见接入文档 §6。对方读到新的位置（站点开启对方已读时），只进不退。'
      required: [event, conversation_id, peer_read_seq]
      properties:
        event: { type: string, const: peer_read }
        conversation_id: { type: integer, format: int64 }
        peer_read_seq: { type: integer, format: int64 }

    PushTyping:
      type: object
      description: '**经长连接下发**，见接入文档 §6。`from` 正在输入，`expires_in` 秒内没有新的、或收到他的消息就不再显示。'
      required: [event, conversation_id, from, expires_in]
      properties:
        event: { type: string, const: typing }
        conversation_id: { type: integer, format: int64 }
        from: { type: string, description: 客服会话里是客服号 }
        expires_in: { type: integer, description: 秒 }

    PushReadAll:
      type: object
      description: |
        **经长连接下发**，见接入文档 §6。一键清全部未读且确有变更时推给本人频道（所有在线设备，含发起设备），不带会话信息：
        收到后把本地各会话未读清零、总未读归零，或重新拉一次会话列表。
      required: [event]
      properties:
        event: { type: string, const: read_all }
